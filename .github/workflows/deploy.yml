name: Deploy to AWS

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Bundle app
        run: |
          zip -r deployment.zip . \
            --exclude "*.git*" \
            --exclude "terraform/*" \
            --exclude "bootstrap/*" \
            --exclude "*.drawio" \
            --exclude ".github/*"

      - name: Upload to S3
        run: |
          aws s3 cp deployment.zip \
            s3://${{ secrets.S3_BUCKET }}/deployments/deployment-${{ github.sha }}.zip

      - name: Trigger CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name aws-challenge \
            --deployment-group-name aws-challenge-dg \
            --s3-location bucket=${{ secrets.S3_BUCKET }},key=deployments/deployment-${{ github.sha }}.zip,bundleType=zip \
            --region eu-central-1
